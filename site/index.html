  <title>ITCHSON</title>
  <link rel="canonical" href="https://itchson.com/" />

  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/assets/ships/ff0040.svg" type="image/svg+xml">

  <script src="/assets/js/runtime.js" defer></script>

<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div id="jetCursor" class="jet-cursor" aria-hidden="true"></div>


  <div class="floating-links">
    <a class="pixel-link" href="https://x.com/itchson" target="_blank" rel="noopener noreferrer" aria-label="Visit X profile @ITCHSON">𝕏 @ITCHSON</a>
    <a class="pixel-link" href="mailto:contact@itchson.com" aria-label="Email contact at itchson dot com">✉ CONTACT</a>
  </div>

  <div id="killCounter" class="floating-kills" aria-live="polite" aria-atomic="true">
    <span id="killText" class="pixel-link"><span class="icon" aria-hidden="true">☠︎︎</span><span class="count" aria-label="kills">0</span></span>
  </div>

  <!-- Mobile controls (touch-only): joystick and shoot button -->
  <div id="mobileControls" class="mobile-controls" aria-hidden="true">
    <div class="joystick" role="application" aria-label="Move">
      <div class="joy-ring outer" aria-hidden="true"></div>
      <div class="joy-ring inner" aria-hidden="true"></div>
      <div class="joystick-thumb" aria-hidden="true"></div>
    </div>
  </div>
  <button id="shootBtn" class="shoot-btn" aria-label="Shoot">𖦏</button>

    <h1 class="sr-only">ITCHSON</h1>
    <div class="logo-container" role="button" tabindex="0" aria-label="ITCHSON pixel logo — reveal letters and reset the game">
      <!-- I -->
      <div class="letter letter-i">
        <div class="pixel-row">
          <span class="pixel"></span><span class="pixel"></span><span class="pixel"></span>
        </div>
        <div class="pixel-row">
          <span class="pixel invisible"></span><span class="pixel"></span><span class="pixel invisible"></span>
        </div>
        <div class="pixel-row">
          <span class="pixel invisible"></span><span class="pixel"></span><span class="pixel invisible"></span>

        </div>
        <div class="pixel-row">
          <span class="pixel invisible"></span><span class="pixel invisible"></span><span class="pixel"></span><span class="pixel invisible"></span><span class="pixel invisible"></span>
        </div>
      </div>

      <!-- C -->

        <div class="pixel-row">
          <span class="pixel invisible"></span><span class="pixel"></span><span class="pixel"></span><span class="pixel"></span>
        </div>
        <div class="pixel-row">
          <span class="pixel"></span><span class="pixel invisible"></span><span class="pixel invisible"></span><span class="pixel invisible"></span>
        </div>
        <div class="pixel-row">
          <span class="pixel"></span><span class="pixel invisible"></span><span class="pixel invisible"></span><span class="pixel invisible"></span>
